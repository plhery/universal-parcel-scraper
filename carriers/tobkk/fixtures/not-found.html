        .top-bar { position: relative; width: 100%; height: 60px; }

        #translate{
            display: none;
        }
        /* =====物流时间线样式===== */
        .wuliu_list {padding-left:8px;}
        .wuliu_list .vo_list{
            display:flex;
            margin:16px 0;
        }
        .wuliu_list .vo_left{
            position:relative;
            width:24px;
            flex-shrink:0;
        }
        .wuliu_list .vo_left .circle{
            width:14px;
            height:14px;
            border-radius:100%;
            display:block;
        }
        /* 最新节点 active：蓝色实心圆 */
        .wuliu_list .vo_list.active .vo_left .circle{
            background:#409EFF;
        }
        /* 历史旧节点：灰色空心圆 */
        .wuliu_list .vo_list .vo_left .circle{
            border:1px solid #999;
            background:#fff;
        }
        .wuliu_list .vo_left .line{
            position:absolute;
            left:6px;
            top:14px;
            bottom:-16px;
            width:1px;
            background:#cccccc;
        }
        .wuliu_list .vo_right{
            line-height:1.5;
        }
        .wuliu_list .vo_right .red{

            font-weight:bold;

    <script>
        function showDetail(that){
            var d = $(that).parents('.order-item').find('.order_detail');
            if($(that).hasClass('active')){
                d.hide(200); $(that).removeClass('active'); $(that).find('i').attr('class','icon-angle-left');
            }else{
                d.show(200); $(that).addClass('active'); $(that).find('i').attr('class','icon-angle-up');
            }
        }
        // window.translate = new Translate();
        // translate.init({ defaultLang:'chinese_simplified' });
    </script>
    <script>
    $(function () {
        $("#select").change(function () {
            var t = $(this).val();
            if (t == 1) {
                window.location.href = "/track.php"
            }
            if (t == 2) {

            }
