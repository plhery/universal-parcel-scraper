<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Seguir Entrega | Activos24</title>
</head>
<body>
<section class="header-title">
        <div class="container">
            <div class="row">
                <div class="col-xs-12 col-sm-7">
                    <h1>Seguir Entrega</h1>
                </div>

            </div>
        </div>
    </section>
    <section class="tracking" style="background: transparent">
        <div class="container">
            <div class="row">
               
                <div class="col-xs-12 col-md-8 col-md-offset-2">
                    <form method="GET" action="https://activos24.com/pt/seguir-encomenda" accept-charset="UTF-8" class="tracking-form">
                    <div class="row">
                        <div class="col-xs-12 text-center">
                            <h2>Localizar a minha entrega</h2>
                            <p class="text-white m-b-30">Acompanhe a entrega das suas encomendas. Insira na caixa o número da sua encomenda.</p>
                        </div>
                    </div>
                        <div class="row row-0">
                            <div class="col-xs-12 col-sm-8 col-md-6 col-md-offset-2">
                                <div class="form-group m-b-0">
                                    <input class="form-control input-lg" name="tracking" type="text" value="001023900321">
                                </div>
                            </div>
                            <div class="col-xs-12 col-sm- col-md-3">
                                <div class="text-center">
                                    <button type="submit" class="btn btn-lg btn-block btn-primary fs-16">
                                        <i class="fas fa-search"></i> Procurar
                                    </button>
                                </div>
                            </div>
                            <div class="col-xs-12 col-sm-8 col-md-6 col-md-offset-2">
                                                                    <p style="color: #ff0000"><i class="fas fa-exclamation-circle"></i> Envio não encontrado.</p>
                                                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
