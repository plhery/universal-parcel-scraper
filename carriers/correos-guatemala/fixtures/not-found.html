<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/estiloIndex.css">
    <link rel="stylesheet" href="estilos/bootstrap-5.3.3-dist/css/bootstrap.css">
    <title>Rastreo de Paquetes</title>
</head>
<body>


<!-- Fila principal con 2 columnas -->
<div class="row g-0 main-row">

    <!-- Columna 1: Contenido principal -->
    <div class="col-12 col-lg-10 col-principal">

        <!-- Header con imagen de fondo: camión + título sobre overlay azul transparente -->
        <div class="col1-header">
            <div class="hero-overlay">
                <img src="estilos/img/icono camion.png" class="hero-truck" alt="Camión">
                <h1 class="hero-title">RASTREO Y SEGUIMIENTO</h1>
            </div>
        </div>

        <!-- Cuerpo: formulario + resultados + info -->
        <div class="col1-body">

            <!-- Formulario -->
            <div class="form-card shadow">
                <h4 class="form-card-title">Ejemplo EE123456789GT (sin espacios)</h4>
                <form action="index.php" method="post" id="trackingForm">
                    <h6 class="form-label-tracking">Tracking</h6>
                    <div class="form-row-custom">
                        <input placeholder="Ejemplo EE123456789GT (sin espacios)"
                            name="tracking"
                            id="tracking"
                            class="form-control form-control-lg"
                            type="text"
                            pattern="[A-Za-z]{2}[0-9]{9}[A-Za-z]{2}"
                            value=""
                            required>
                        <button id="btnConsultarTracking" class="btn-buscar" type="submit">Buscar</button>
                    </div>
                </form>

                            </div>

            <!-- Resultados -->
            <div id="resultados-rastreo">
                                    <div class="alert alert-danger">No se encontro información relacionada al Tracking</div>
                            </div>

        </div><!-- /col1-body -->
    </div><!-- /col-principal -->

</div><!-- /main-row -->


<script src="scripts/scripts.js"></script>
<script src="estilos/bootstrap-5.3.3-dist/js/bootstrap.js"></script>
</body>
</html>
