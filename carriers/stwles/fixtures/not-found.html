<script>

$(document).ready(function() {
	$("#cwb").keydown(function(event){
		if(event.keyCode==13) {
			if($("#cwb").val()==""){
				alert('请输入订单号');
				return false;
			}
			$("#seachForm").submit();
		}
	});
	$("#btnsearch").click(function(){
		if($("#cwb").val()==""){
			alert('请输入订单号');
			return;
		}
		$("#seachForm").submit();
		
	});
});

</script>
</head>
