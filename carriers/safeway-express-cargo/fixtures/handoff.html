<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Safe Way Express Cargo</title>
</head>
<body dir="ltr">
    <!-- Main Content Start -->


<!-- Tracking Section -->
<section class="section tracking-section">
    <div class="container">
        <div class="section-header text-center compact-header">
            <h2>Track Your Shipment</h2>
            <div class="section-divider mx-auto mb-3"></div>
        </div>
        
                <div class="minimalist-tracking-form-container mb-4">
            <form id="trackingForm" class="minimalist-tracking-form" method="get" action="">
                <div class="minimalist-form-wrapper">
                    <div class="barcode-icon">
                        <i class="fas fa-barcode"></i>
                    </div>
                    <div class="tracking-input-wrapper">
                        <input type="text" id="trackingNumber" class="minimalist-input" name="awb" value="BH99000017" placeholder="Enter your tracking number" required>
                    </div>
                    <div class="track-button-wrapper">
                        <button type="submit" class="track-circle-btn">Track</button>
                    </div>
                </div>
            </form>
            <div class="mt-2 text-center">
                <small class="text-muted">Example: BH99000017</small>
            </div>
        </div>
        
        <!-- Tracking Results -->
                <div id="trackingResults" class="tracking-results">
                                            <div class="tracking-info">
                    <div class="tracking-header">
                        <div class="tracking-number">
                            <span>Tracking Number:</span>
                            <strong>BH99000017</strong>
                        </div>
                                                <div class="tracking-status ">
                            <span>Status:</span>
                            <strong></strong>
                        </div>
                    </div>
                    <p>&nbsp;</p>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="shipment-info-section">
                                <h3><i class="fas fa-box"></i> Shipment Information</h3>
                                <div class="shipment-details-content">
                                    <div class="detail-item animate-fade-in">
                                        <span><i class="fas fa-truck detail-icon"></i>Carrier:</span>
                                        <strong>Aramex</strong>
                                    </div>
                                    <div class="detail-item animate-fade-in">
                                        <span><i class="fas fa-barcode detail-icon"></i>Carrier Tracking Number:</span>
                                        <strong class="tracking-number-value">39900000011</strong>
                                    </div>
                                    <div class="detail-item animate-fade-in">
                                        <span><i class="fas fa-calendar-alt detail-icon"></i>Shipped Date:</span>
                                        <strong class="date-value">2026-09-14</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="shipping-details-section">
                                <h3><i class="fas fa-shipping-fast"></i> Shipping Details</h3>
                                <div class="shipment-details-content">
                                                                        
                                                                        
                                                                    </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Timeline section -->
                    <div class="tracking-timeline">
                        <h4>Shipment Progress</h4>
                        
                                                <p class="text-muted">No tracking events available yet.</p>
                                            </div>
                </div>
                    </div>
                
        

<!-- How to Track Section -->
<section class="section how-to-track py-4">
    <div class="container">
        <h2 class="h3">How to Track Your Shipment</h2>
    </div>
</section>

</div>
    <!-- Main Content End -->
</body>
</html>
