<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>    Seguimento de envio |
 Logisimple - Transportes, Montagens e Mudanças</title>
    </head>
    <body>
    <section>
        <div class="container">
            <div class="row">
                <div class="col-xs-12">
                    <div class="card card-tracking m-b-0 p-20">
                        <div class="card-body">
                            <form method="GET" action="https://portal.logisimple.pt/pt/tracking" accept-charset="UTF-8">
                                <div class="row row-5">
                                    <div class="col-xs-10 col-sm-6 col-md-8">
                                        <div class="form-group m-b-0" style="margin: 0">
                                            <input class="form-control nospace" value="000000000025" placeholder="Ex. 001023900321, 005068105492, ..." name="tracking" type="text">
                                        </div>
                                    </div>
                                    <div class="col-xs-2 col-sm-3 col-md-2">
                                        <button type="submit" class="btn btn-block btn-primary">
                                            <i class="fas fa-search"></i> <span class="hidden-xs">Procurar envio</span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section>
        <div class="container">
            <div class="row">
                <div class="col-xs-12">
                    <div class="card m-b-0">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-sm-8 col-sm-offset-2">
                                    <div class="text-center">
                                        <img class="w-120px m-b-15" src="data:image/svg+xml;base64,PHN2Zy8+" />
                                    </div>
                                    <h4 class="lh-1-4 m-b-100 text-center">
                                        Não encontrámos correspondências para o código de envio <b>"000000000025"</b>.
                                    </h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </body>
</html>
