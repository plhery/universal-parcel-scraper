<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
					<title>  Track your shipment |  JOMKIRIM COURIER</title>
				<meta name="description" content="Login page" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	</head>
	<body id="kt_body" class="header-fixed header-mobile-fixed subheader-enabled subheader-fixed aside-enabled aside-fixed aside-minimize-hoverable page-loading">
        <div class="d-flex flex-column-fluid">
    <div class="container">
        <div class="card card-custom gutter-b">
            <div class="alert alert-custom alert-white  gutter-b mb-0 pb-0" role="alert">
                <div class="alert-text">
                    <p class="d-block py-20 text-center">
                        <a href="https://courier.jomkirim.com">
                                                            <img src="https://courier.jomkirim.com/public/uploads/all/0XInhf7wtNXA3cPFvVlBpVSug48MoGHfD3lSrbpI.png" alt="JOMKIRIM COURIER" style="max-width:150px">
                                                    </a>
                    </p>
                    <p class="mt-50 text-center"><a href="https://courier.jomkirim.com">BACK TO HOME</a></p>
                    <p class="mt-50 text-center"><span class="label label-inline label-pill label-danger label-rounded mr-2">NOTE:</span>For inquiries about your shipments, please contact us from <a href="#">Here</a>.</p>
                </div>
            </div>
            <div class="card-header">
                <div class="card-title">
                    <h5 class="card-label  text-center">Track your shipment</h5>
                </div>
            </div>
            <form class="form" action="https://courier.jomkirim.com/shipment/tracking" method="GET">
                <div class="card-body">
                    <div class="row">
                        <div class="col-xl-3"></div>
                        <div class="col-xl-6">
                            <div class="form-group">
                                <label>Enter your tracking code</label>
                                <input type="text" class="form-control form-control-solid form-control-lg" name="code" placeholder="Example: SH00001">
                            </div>
                        </div>
                        <div class="col-xl-3"></div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="row">
                        <div class="col-xl-3"></div>
                        <div class="col-xl-6">
                            <button type="submit" class="btn btn-primary font-weight-bold mr-2">Search</button>
                        </div>
                        <div class="col-xl-3"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
        <script type="text/javascript">
                            AIZ.plugins.notify('danger', 'Invalid shipment code');
                    </script>
	</body>
</html>
