<!DOCTYPE html>
<html>
<head><title>Track-info</title></head>
<body>
<form method="post" action="./Track-info.aspx" id="form1">
<div class="aspNetHidden">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="synthetic-viewstate-not-found" />
<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="030FB453" />
<input type="hidden" name="__VIEWSTATEENCRYPTED" id="__VIEWSTATEENCRYPTED" value="" />
</div>
<div class="tt-wrap">

    <section class="c-pad track-line">
        <div class="tt-card">
            <div class="col text-center">
                <h3>Track n Trace</h3>
                <div class="nav nav-fill d-flex tt-stepper w-100" id="nav-tab1" role="tablist">
                    <a href="#consignor-details" id="ContentPlaceHolderMid_ContentPlaceHolder2_ActiveBooked" class="col-md-auto col-4 nav-item nav-link" data-toggle="tab" role="tab" aria-controls="consignor-details" aria-selected="true">
                        <span class="tt-step-icon" aria-hidden="true">📦</span>
                        <span class="mt-0">Booked</span>
                    </a>
                    <a href="#consignee-details" id="ContentPlaceHolderMid_ContentPlaceHolder2_ActiveOntransit" class="col-md-auto col-4 nav-item nav-link" data-toggle="tab" role="tab" aria-controls="consignee-details" aria-selected="false">
                        <span class="tt-step-icon" aria-hidden="true"></span>
                        <span class="mt-0">Transit</span>
                    </a>
                    <a href="#payment-details" id="ContentPlaceHolderMid_ContentPlaceHolder2_ActiveDelivered" class="col-md-auto col-4 nav-item nav-link" data-toggle="tab" role="tab" aria-controls="payment-details" aria-selected="false">
                        <span class="tt-step-icon" aria-hidden="true">✅</span>
                        <span class="mt-0">Delivered</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <section id="ContentPlaceHolderMid_ContentPlaceHolder2_trackSection" class="track-line">
        <div class="tt-card text-center">

            <div class="tt-status-headline">
                <span id="ContentPlaceHolderMid_ContentPlaceHolder2_lbl_track" style="font-size:Large;">We are sorry! Your consignment status request could not be processed. Please enter your contact details and we shall revert to you at the earliest. Thank you.</span>
                <span class="text-danger">
                    <span id="ContentPlaceHolderMid_ContentPlaceHolder2_lbl_trackVal" style="font-size:Large;"></span>
                </span>
                <span id="ContentPlaceHolderMid_ContentPlaceHolder2_lblLatUpdt" style="font-size:Large;"></span>
            </div>

            <div class="text-left">
                
            </div>

                <div id="ContentPlaceHolderMid_ContentPlaceHolder2_divReg" class="row justify-content-center align-items-center mt-3" style="display:flex; flex-wrap:wrap; gap:16px 24px;">

</div>

        </div>
    </section>

    </div>

</form>
</body>
</html>
