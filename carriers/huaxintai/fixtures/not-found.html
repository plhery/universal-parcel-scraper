    <script type="text/javascript">
        //运单输入框
        $(".text").mousemove(function () {
            if ($(this).val() == "最多同时输入5个运单号,每个运单号以逗号分隔.例如:10536621455,107846545") {
                $(this).val("");
                $(this).attr("style", "font-size:16px;color:black;");
            }
        }).mouseleave(function () {
            if ($.trim($(this).val()).length == 0) {
                $(this).val("最多同时输入5个运单号,每个运单号以逗号分隔.例如:10536621455,107846545");
                $(this).removeAttr("style");
            }
            else {
                $(this).attr("style", "font-size:16px;color:black;");
            }
        });
        //提交按钮
        $("#btn_tj").click(function () {
            var ydlist = $.trim($(".text").val());

            if (ydlist.length == 0) {
                $.jBox.error("运单号不能为空！", "提示!");
                return false;
            }
            if (ydlist.split(",").length > 5) {
                $.jBox.error("运单号最多只能为5个！", "提示!");
                return false;
            }
            if (ydlist == "最多同时输入5个运单号,每个运单号以逗号分隔.例如:10536621455,107846545") {
                $.jBox.error("请输入运单号！", "提示!");
                return false;
            }

            var name, value, i;
            var str = location.href;
            var num = str.indexOf("?");
            str = str.substr(num + 1);
            var arrtmp = str.split("&");
            num = arrtmp[0].indexOf("=");
            if (num > 0) 
            {
                name = arrtmp[0].substring(0, num);
                value = arrtmp[0].substr(num + 1);
                this[name] = value;
            }

            var url = "OnlineTrack.aspx?cid=" + value + "&yid=" + ydlist;
            window.location = url;
        });
        var length = $("#flowstepid li").length;
        if (length == 3) {
            var str = "<style>#flowstepid li{width:24%;}</style>";
            $("body").append(str);
        }
        else if (length == 4) {
            var str = "<style>#flowstepid li{width:19%;}</style>";
            $("body").append(str);
        }
        else if (length == 5) {
            var str = "<style>#flowstepid li{width:15%;}</style>";
            $("body").append(str);
        }
        else if (length == 6) {
            var str = "<style>#flowstepid li{width:12%;}</style>";
            $("body").append(str);
        }
