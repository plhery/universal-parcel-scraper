<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSRF Token -->
    <meta name="csrf-token" content="SampleCsrfToken0000000000000000000000000">

    <title>Track collection parcel</title>

    <!-- Scripts -->
    <script src="/js/public.js" defer></script>
</head>
<body>
    <div id="app">
        <header class="track-header">
                <a class="navbar-brand" href="https://starlinks.app">
                    <img src="/images/sample-logo.png" alt="Starlinks">
                </a>
        </header>

        <main class="py-4 track-page track-page-template-custom-1">
                <public-tracking-page
        :parcel="null"
        :brand="{&quot;id&quot;:54,&quot;name&quot;:&quot;Starlinks&quot;,&quot;is_active&quot;:true}"
        :holidays="null"
        :is-starlinks="true"
        :zipcode-required="false"
        :zipcode="&quot;&quot;"
        :search="&quot;XYZ0001GB99999999001&quot;"
        :csrf-token="&quot;SampleCsrfToken0000000000000000000000000&quot;"
        error="Parcel not found"
    ></public-tracking-page>
        </main>

    </div>
</body>
</html>
