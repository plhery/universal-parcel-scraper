<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>배송추척</title>
    <link rel="stylesheet" type="text/css" href="resource/tracking/suio.css" media="all" charset="utf-8" />

<body id="popup">
    <div id="wrap" class="fastboxWrap">
        <!-- fastbox일 경우 class="fastboxWrap", GLS일 경우 class="glxWrap" -->
        <h1 class="mTrackOrder"><img src="//img.echosting.cafe24.com/scm/dhub/h1_fastbox_logo.gif" alt="TRACK ORDER" />
        </h1>
        <div class="section">
            <div class="mBoard gMedium">
                <form name="Tracking" id="Tracking">
                    <table border="1" summary="">
                        <caption>FB Invoice Search</caption>
                        <tbody>
                            <tr>
                                <th scope="row">FB Invoice No.</th>
                                <td>
                                    <input type="text" class="fText" style="width:210px;" name="fb_invoice_no"
                                        value="FB2601010000000002" />
                                    <a href="#none" onclick="Tracking.submit()"
                                        class="btnSearch"><span>Search</span></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </form>
            </div>
        </div>
        </div><script type="text/javascript" charset="utf-8">alert('It is not a valid FASTBOX invoice number.\nPlease enter correct FASTBOX invoice number. (18-digits)\n(e.g. FB1612345678901245)');</script></body>
