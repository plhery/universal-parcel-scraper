<!doctype html>
<html lang="en"><head><title>Track Parcel | SriCourier</title></head><body>
  <form method="GET" action="https://sricourier.lk/track"><input type="text" name="tracking_no"></form>
  <div class="bg-white rounded-2xl shadow p-8 grid md:grid-cols-4 gap-6 text-center">
    <div><p class="text-sm text-gray-500">Tracking No</p><p class="font-semibold">SC-239485</p></div>
    <div><p class="text-sm text-gray-500">Status</p><span>Out for Delivery</span></div>
  </div>
  <h3>Delivery Progress</h3>
  <div class="relative border-l border-gray-200 ml-3 space-y-8">
    <div><h4>Order Placed</h4><p>Completed</p></div>
    <div><h4>Picked Up</h4><p>Completed</p></div>
    <div><h4>In Transit</h4><p>Completed</p></div>
    <div><h4>Out for Delivery</h4><p>Current</p></div>
    <div><h4>Delivered</h4><p>Pending</p></div>
  </div>
</body></html>
