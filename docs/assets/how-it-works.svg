<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -2 936 292" role="img" aria-label="An input is detected offline and fetched by the carrier's dedicated adapter, or by an enabled fallback when that finds no history. Each scan's wording is mapped to a stage, and the result is one timeline.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; fill: #fffaf0; }
    .sub { font-size: 12px; fill: #b5b1a3; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #b5b1a3; }
    .box { fill: #23221c; stroke: #3a382e; }
    .flow { fill: none; stroke: #b5b1a3; stroke-width: 1.5; }
    .hair { fill: none; stroke: #3a382e; }
  </style>
  <rect x="-27.5" y="-1.5" width="935" height="291" rx="12" fill="#171714" stroke="#3a382e"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9Z" fill="#b5b1a3"/>
    </marker>
  </defs>

  <rect class="box" x="2.5" y="24.5" width="156" height="92" rx="10"/>
  <text class="title" x="80.5" y="62">Your input</text>
  <text class="sub" x="80.5" y="83">a number, a tracking link</text>
  <text class="sub" x="80.5" y="100">or a pasted message</text>

  <rect class="box" x="182.5" y="24.5" width="156" height="92" rx="10"/>
  <text class="title" x="260.5" y="62">Detect</text>
  <text class="sub" x="260.5" y="83">offline, from patterns</text>
  <text class="sub" x="260.5" y="100">and checksums</text>

  <rect class="box" x="362.5" y="24.5" width="156" height="92" rx="10"/>
  <text class="title" x="440.5" y="62">Fetch</text>
  <text class="sub" x="440.5" y="83">the carrier's own site,</text>
  <text class="sub" x="440.5" y="100">over HTTP or a browser</text>

  <rect class="box" x="542.5" y="24.5" width="156" height="92" rx="10"/>
  <text class="title" x="620.5" y="62">Read the stage</text>
  <text class="sub" x="620.5" y="83">each scan's wording,</text>
  <text class="sub" x="620.5" y="100">filed under one list</text>

  <rect x="722.5" y="24.5" width="156" height="92" rx="10" fill="#4d4113" stroke="#f3cf48"/>
  <text class="title" x="800.5" y="62">One timeline</text>
  <text class="sub" x="800.5" y="83">the same JSON</text>
  <text class="sub" x="800.5" y="100">for every carrier</text>

  <path class="flow" d="M162 70.5H179" marker-end="url(#head)"/>
  <path class="flow" d="M342 70.5H359" marker-end="url(#head)"/>
  <path class="flow" d="M522 70.5H539" marker-end="url(#head)"/>
  <path class="flow" d="M702 70.5H719" marker-end="url(#head)"/>

  <path class="hair" d="M80.5 117V140"/>
  <rect class="box" x="2.5" y="140.5" width="156" height="26" rx="6"/>
  <text class="mono" x="80.5" y="157.5">1Z999AA10123456784</text>
  <rect class="box" x="2.5" y="174.5" width="156" height="26" rx="6"/>
  <text class="mono" x="80.5" y="191.5">dhl.com/…?id=…</text>
  <rect class="box" x="2.5" y="208.5" width="156" height="26" rx="6"/>
  <text class="mono" x="80.5" y="225.5">"Your order shipped…"</text>

  <path class="hair" d="M260.5 117V140"/>
  <rect class="box" x="182.5" y="140.5" width="156" height="46" rx="6"/>
  <text class="mono" x="260.5" y="159">carrier: "ups"</text>
  <text class="mono" x="260.5" y="176">confidence: "high"</text>

  <rect class="box" x="362.5" y="170.5" width="336" height="92" rx="10"/>
  <text class="title" x="530.5" y="208">Fallbacks you switched on</text>
  <text class="sub" x="530.5" y="229">UPU for postal numbers by default</text>
  <text class="sub" x="530.5" y="246">ParcelsApp, Ship24, 17TRACK, Postal Ninja on request</text>

  <path class="flow" d="M440.5 122V165" marker-end="url(#head)"/>
  <text class="sub" x="452" y="148" style="text-anchor: start">no history</text>
  <path class="flow" d="M620.5 165V122" marker-end="url(#head)"/>
</svg>
