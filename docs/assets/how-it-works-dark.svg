<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" role="img" aria-label="An input is detected offline, tracked by a dedicated adapter, falls back to enabled providers when there is no history, and comes back as one timeline">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .sub { font-size: 12px; fill: #9198a1; }
    .mono { font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #9198a1; }
    .box { fill: #151b23; stroke: #3d444d; }
    .flow { fill: none; stroke: #9198a1; stroke-width: 1.5; }
    .hair { fill: none; stroke: #3d444d; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9Z" fill="#9198a1"/>
    </marker>
  </defs>

  <rect class="box" x="10.5" y="24.5" width="172" height="92" rx="10"/>
  <text class="title" x="96.5" y="62">Your input</text>
  <text class="sub" x="96.5" y="83">a number, a tracking link</text>
  <text class="sub" x="96.5" y="100">or a pasted message</text>

  <rect class="box" x="226.5" y="24.5" width="172" height="92" rx="10"/>
  <text class="title" x="312.5" y="62">Detect</text>
  <text class="sub" x="312.5" y="83">offline, from patterns</text>
  <text class="sub" x="312.5" y="100">and checksums</text>

  <rect class="box" x="442.5" y="24.5" width="172" height="92" rx="10"/>
  <text class="title" x="528.5" y="62">Dedicated adapter</text>
  <text class="sub" x="528.5" y="83">the carrier's own site,</text>
  <text class="sub" x="528.5" y="100">over HTTP or a browser</text>

  <rect x="658.5" y="24.5" width="172" height="92" rx="10" fill="#12302b" stroke="#2a9d85"/>
  <text class="title" x="744.5" y="62">One timeline</text>
  <text class="sub" x="744.5" y="83">the same stages and JSON</text>
  <text class="sub" x="744.5" y="100">for every carrier</text>

  <path class="flow" d="M188 70.5H221" marker-end="url(#head)"/>
  <path class="flow" d="M404 70.5H437" marker-end="url(#head)"/>
  <path class="flow" d="M620 70.5H653" marker-end="url(#head)"/>

  <path class="hair" d="M96.5 117V140"/>
  <rect class="box" x="10.5" y="140.5" width="172" height="26" rx="6"/>
  <text class="mono" x="96.5" y="157.5">1Z999AA10123456784</text>
  <rect class="box" x="10.5" y="174.5" width="172" height="26" rx="6"/>
  <text class="mono" x="96.5" y="191.5">dhl.com/tracking?id=…</text>
  <rect class="box" x="10.5" y="208.5" width="172" height="26" rx="6"/>
  <text class="mono" x="96.5" y="225.5">"Your order shipped…"</text>

  <path class="hair" d="M312.5 117V140"/>
  <rect class="box" x="226.5" y="140.5" width="172" height="46" rx="6"/>
  <text class="mono" x="312.5" y="159">carrier: "ups"</text>
  <text class="mono" x="312.5" y="176">confidence: "high"</text>

  <rect class="box" x="442.5" y="180.5" width="388" height="92" rx="10"/>
  <text class="title" x="636.5" y="218">Fallbacks you switched on</text>
  <text class="sub" x="636.5" y="239">UPU for postal numbers by default</text>
  <text class="sub" x="636.5" y="256">ParcelsApp, Ship24, 17TRACK and Postal Ninja on request</text>

  <path class="flow" d="M528.5 122V175" marker-end="url(#head)"/>
  <text class="sub" x="540" y="153" style="text-anchor: start">no history</text>
  <path class="flow" d="M744.5 175V122" marker-end="url(#head)"/>
</svg>
