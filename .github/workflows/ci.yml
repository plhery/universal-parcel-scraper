name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:scripts
      - run: npm run test:generated
      - run: npm run build
      - run: npm run test:package
      - run: npm audit --omit=dev
  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t universal-parcel-scraper:test .
      - name: Check health, detection, and browser bundle
        run: |
          set -euo pipefail
          docker run -d --name parcel-scraper-test -p 127.0.0.1:8080:8080 -e SCRAPER_DEMO_PAGE=true universal-parcel-scraper:test
          trap 'docker logs parcel-scraper-test; docker rm -f parcel-scraper-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/assets/scraper.js >/dev/null
          curl -fsS http://127.0.0.1:8080/v1/detect -H 'Content-Type: application/json' \
            -d '{"text":"1Z999AA10123456784"}' | jq -e '.carrier == "ups"'
