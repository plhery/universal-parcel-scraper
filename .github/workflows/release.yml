name: Release
# npm trusts this workflow file to publish the package, so both channels
# publish from here: a push to main publishes a prerelease under `next`, and a
# dispatch publishes the package.json version under `latest`. Either publishes
# only once the CI and secret scanning workflows have passed on the same commit.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json
        required: true
        type: string
      publish_npm:
        description: Publish using npm trusted publishing
        required: true
        type: boolean
        default: false
      publish_trawl:
        description: Publish the AGPL TRAWL derivative with its source archives
        required: true
        type: boolean
        default: false
permissions:
  contents: read
# Pushes run one at a time and in order; a queued push gives way to a newer
# one, which contains it. Dispatched releases queue apart from pushes, so a
# push never cancels a queued release. No run waits for npm to list what it
# published while it holds its place: npm can take an hour, and every push
# behind it would wait as long.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  checks:
    name: CI and secret scanning passed on this commit
    # A push to a fork does nothing.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'plhery/universal-parcel-scraper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    # CI tests every supported Node version and the container, and secret
    # scanning runs Gitleaks over the history. A push starts both beside this
    # workflow, so this waits for each one's pushed or dispatched runs on this
    # commit: one that passed lets the release go on, and once all have
    # finished without passing, the release stops. After rerunning either,
    # rerun this workflow's failed jobs. GitHub's lists of runs sometimes come
    # back empty, so three lists are read, each workflow gets its own ten
    # minutes to appear, and once its run has been seen an empty answer only
    # means waiting longer.
    steps:
      - run: |
          started=$SECONDS
          for workflow in ci.yml secrets.yml; do
            seen=false since=$SECONDS
            while true; do
              state=$({
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[]'
                gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
                  --jq ".workflow_runs[] | select(.path == \".github/workflows/$workflow\")"
                gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$GITHUB_REF_NAME&per_page=100" \
                  --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\")"
              } | jq -rs '
                unique_by(.id) | [.[] | select(.event == "push" or .event == "workflow_dispatch")]
                | if any(.conclusion == "success") then "passed"
                  elif length == 0 then "missing"
                  elif any(.status != "completed") then "running"
                  else "failed" end')
              elapsed=$((SECONDS - started))
              case "$state" in
                passed) echo "$workflow passed on $GITHUB_SHA."; break ;;
                failed) echo "::error::$workflow failed on $GITHUB_SHA, so nothing is published."; exit 1 ;;
                running) seen=true ;;
                missing) if [ "$seen" = false ] && [ $((SECONDS - since)) -ge 600 ]; then
                    echo "::error::$workflow has not run on $GITHUB_SHA. Dispatch it on this ref, then rerun this job."; exit 1
                  fi ;;
              esac
              if [ "$elapsed" -ge 4200 ]; then echo "::error::$workflow is still running on $GITHUB_SHA."; exit 1; fi
              sleep 30
            done
          done
  prerelease:
    needs: checks
    if: ${{ github.event_name == 'push' && github.repository == 'plhery/universal-parcel-scraper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job at a time plans and publishes to npm, whichever channel it serves.
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Plan the prerelease
        id: plan
        run: node scripts/prerelease.mjs
      # npm accepts a publish before it serves the version, sometimes an hour
      # later. Until then the next plan compares with the newest version npm
      # lists, and a rerun plans this version again, which npm then refuses as
      # already published.
      - name: Publish npm prerelease with provenance
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          PRERELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm version "$PRERELEASE_VERSION" --no-git-tag-version
          if ! npm publish --tag next --access public --provenance --ignore-scripts 2> publish.log; then
            cat publish.log >&2
            if grep -q 'cannot publish over the previously published version' publish.log; then
              echo "npm already has $PRERELEASE_VERSION."
              exit 0
            fi
            exit 1
          fi
          cat publish.log >&2
  publish:
    needs: checks
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: release-npm
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      notify: ${{ steps.npm.outputs.notify }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release identity
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const v=process.env.RELEASE_VERSION; if(!/^\d+\.\d+\.\d+$/.test(v) || JSON.parse(fs.readFileSync('package.json')).version!==v) process.exit(1);"
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then exit 1; fi
      - name: Plan the npm release
        id: npm
        if: ${{ inputs.publish_npm }}
        run: node scripts/prerelease.mjs --stable
      - run: npm ci --ignore-scripts && npm run build && npm pack --ignore-scripts
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ inputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: ${{ inputs.publish_trawl }}
        with:
          context: trawl
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}-trawl:${{ inputs.version }}
          # TRAWL's own image names its upstream commit; this one names ours.
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish npm package with provenance
        if: ${{ steps.npm.outputs.publish == 'true' }}
        run: npm publish --provenance --access public --ignore-scripts
  # Outside the npm lock, so that the pushes behind it publish while npm takes
  # its time to list the version.
  tag:
    name: Tag the release once npm lists it
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Before the tag, so that a rerun after a failure here still passes the identity check.
      - name: Wait until npm lists the version
        if: ${{ needs.publish.outputs.notify == 'true' }}
        run: node scripts/prerelease.mjs --await "$RELEASE_VERSION"
      - run: npm ci --ignore-scripts && npm run build && npm pack --ignore-scripts
      - name: Include matching TRAWL source
        if: ${{ inputs.publish_trawl }}
        run: |
          gh api repos/germondai/trawl/tarball/fc3f64a7eebc9776c39bad1b5ed72b461cd3cdbb > trawl-upstream-source.tar.gz
          git archive --format=tar.gz --prefix=universal-parcel-scraper/ HEAD trawl > trawl-patch-source.tar.gz
      - name: Tag and publish GitHub release
        run: |
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"
          cat > release-notes.md <<'NOTES'
          Standalone parcel detection and tracking, with a Node library, CLI and stateless HTTP API.

          The core package is Apache-2.0. Optional TRAWL artifacts are AGPL-3.0 and include matching source archives.
          NOTES
          files=("universal-parcel-scraper-$RELEASE_VERSION.tgz")
          if [ -f trawl-upstream-source.tar.gz ]; then files+=(trawl-upstream-source.tar.gz trawl-patch-source.tar.gz); fi
          gh release create "v$RELEASE_VERSION" "${files[@]}" --verify-tag --title "v$RELEASE_VERSION" --notes-file release-notes.md
